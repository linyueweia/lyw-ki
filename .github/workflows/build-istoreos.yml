name: Build iStoreOS (KICKPI K1)

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 强制重新编译（即使上游无更新）
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

concurrency:
  group: build-istoreos-kickpi-k1
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  TZ: Asia/Shanghai
  ARCHITECTURE: armv8

jobs:
  watch-upstream:
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
    steps:
    - uses: actions/checkout@main

    - name: 检查上游 istoreos-25.12 更新
      id: check
      run: |
        FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force_build || 'false' }}"
        LAST_SHA=""
        if [ -f last-upstream-sha ]; then
          LAST_SHA=$(cat last-upstream-sha)
        fi
        echo "last_built_sha=${LAST_SHA}"
        echo "force_build=${FORCE}"

        API_SHA=$(curl -s "https://api.github.com/repos/istoreos/istoreos/commits/istoreos-25.12?per_page=1" \
          | sed -n 's/.*"sha": *"\([0-9a-f]\{40\}\)".*/\1/p' | head -1 || true)
        echo "upstream_sha=${API_SHA}"

        if [ "$FORCE" = "true" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        elif [ -z "$API_SHA" ]; then
          echo "检查上游失败，本次跳过"
          echo "changed=false" >> $GITHUB_OUTPUT
        elif [ "$API_SHA" = "$LAST_SHA" ]; then
          echo "上游无更新，无需重编"
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "上游有新版本，触发重编"
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
        echo "upstream_sha=${API_SHA}" >> $GITHUB_OUTPUT

  build:
    needs: watch-upstream
    if: needs.watch-upstream.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
    - name: 准备完成
      uses: actions/checkout@main

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "------------------------------- 更新并安装依赖 -------------------------------"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/ubuntu-22.04) || true
        sudo -E apt-get -qq install -y python3-pip >/dev/null 2>&1 || true
        sudo pip3 install pyelftools || true
        echo "------------------------------- 清理Docker镜像和软件 -------------------------------"
        docker rmi `docker images -q` || true
        docker image prune -a -f || true
        sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
        sudo -E apt-get -qq autoremove --purge || true
        echo "------------------------------- 设置工作目录及时区 -------------------------------"
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源码
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ubuntu-22.04-${{ env.ARCHITECTURE }}-${{ env.REPO_BRANCH }}-k1
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义 feeds+DIY1（注入 K1 板级支持 + Maxio PHY 驱动）
      env:
        FEEDS_CONF_PATH: ${{ env.ARCHITECTURE }}/${{ env.FEEDS_CONF }}
      run: |
        [ -e $FEEDS_CONF_PATH ] && mv $FEEDS_CONF_PATH openwrt/$FEEDS_CONF
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 板级静态门禁（DTS 复位脚 / Maxio 6.12 API）
      # 这两条都是"实测踩过、且只在实机/CI 才炸"的坑，必须在编译前拦住：
      #   1) 第二口 PHY 复位脚：KK 线曾把 <&gpio3 RK_PB3>（gpio3 pin 11）当第二 PHY 复位，
      #      实际必须 GPIO2_D3（gpio2 pin 0x1b=27）→ PHY 永不复位、MDIO 0/1/2 全无应答、
      #      "Cannot attach to PHY (error: -19)"，整口不可用（飞牛线 DTB 对照定案）。
      #   2) maxio.c 调用 phy_disable_eee_mode()：该函数 6.12 已从 phylib 移除
      #      → implicit declaration，整个内核编译失败（CI 首跑即挂在这里）。
      run: |
        set -e
        DTS=openwrt/target/linux/rockchip/dts/rk3568/rk3568-kickpi-k1.dts
        DRV=openwrt/target/linux/rockchip/files/drivers/net/phy/maxio.c
        echo "--- 1) 第二口 PHY 复位脚必须是 gpio2 PD3 ---"
        grep -q 'snps,reset-gpio = <&gpio2 RK_PD3 GPIO_ACTIVE_LOW>;' "$DTS" \
          || { echo "!! 第二口 reset-gpio 不是 gpio2 RK_PD3（写错 = PHY 永不复位、整口不可用）"; exit 1; }
        if grep -q 'snps,reset-gpio = <&gpio3 RK_PB3' "$DTS"; then
          echo "!! 第二口 reset-gpio 又写回了 gpio3 RK_PB3（历史 bug）"; exit 1
        fi
        grep -q 'snps,reset-gpio = <&gpio3 RK_PA7 GPIO_ACTIVE_LOW>;' "$DTS" \
          || { echo "!! 第一口 reset-gpio（gpio3 PA7）缺失，两侧必须与飞牛线一致"; exit 1; }
        echo "    OK  reset-gpio: eth1=gpio2 PD3 / eth0=gpio3 PA7"
        echo "--- 2) Maxio 驱动必须用 6.12 API 关 EEE ---"
        grep -q 'phy_disable_eee_mode' "$DRV" \
          && { echo "!! maxio.c 仍在调用 phy_disable_eee_mode()（6.12 已移除 → 内核编译失败）"; exit 1; }
        grep -q 'phydev->eee_cfg.eee_enabled = false;' "$DRV" \
          || { echo "!! maxio.c 缺 6.12 关 EEE 的做法（eee_cfg.eee_enabled=false）"; exit 1; }
        grep -q 'linkmode_zero(phydev->advertising_eee);' "$DRV" \
          || { echo "!! maxio.c 缺 EEE 通告位清零（linkmode_zero(advertising_eee)）"; exit 1; }
        echo "    OK  maxio.c 使用 6.12 EEE API"
        echo "板级静态门禁: ALL PASS"

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置+DIY2
      env:
        CONFIG_FILE_PATH: ${{ env.ARCHITECTURE }}/${{ env.CONFIG_FILE }}
      run: |
        [ -e $CONFIG_FILE_PATH ] && mv $CONFIG_FILE_PATH openwrt/$CONFIG_FILE
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        # 强制只编译 kickpi_k1（本仓库只出 K1 固件）
        sed -i 's/^CONFIG_TARGET_ALL_PROFILES=y$/# CONFIG_TARGET_ALL_PROFILES is not set/' .config
        sed -i 's/^CONFIG_TARGET_MULTI_PROFILE=y$/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config
        sed -i '/^CONFIG_TARGET_DEVICE_.*=y$/d' .config
        echo 'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_kickpi_k1=y' >> .config
        grep -E 'CONFIG_TARGET_.*=y|CONFIG_TARGET_DEVICE' .config
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        set -o pipefail
        make -j$(nproc) PROFILE=kickpi_k1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/world-build.log" || {
          echo "===> main build FAILED; verbose single-thread retry"
          make -j1 PROFILE=kickpi_k1 V=s 2>&1 | tail -150
          exit 1
        }
        echo "FILE_DATE=_$(date +\"%Y%m%d%H%M\")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传编译日志
      uses: actions/upload-artifact@main
      if: always() && hashFiles('world-build.log') != ''
      with:
        name: world-build-log
        path: world-build.log

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 上传 bin 文件夹
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件文件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 发布 Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: k1-v25.12-${{ env.FILE_DATE }}-${{ github.sha }}
        name: iStoreOS KICKPI K1 固件 ${{ env.FILE_DATE }}
        body: |
          images 与 sha256sums 见本 Release assets。
          双千兆 PHY: Maxio MAE0621A（内核内置驱动）。
        files: |
          openwrt/bin/targets/*/*/istoreos-*
          openwrt/bin/targets/*/*/sha256sums
        fail_on_unmatched_files: true

    - name: 记录已编译上游版本
      if: success()
      env:
        UPSTREAM_SHA: ${{ needs.watch-upstream.outputs.upstream_sha }}
      run: |
        cd "$GITHUB_WORKSPACE"
        git config user.name "istore-build-bot"
        git config user.email "istore-build-bot@users.noreply.github.com"
        echo "${UPSTREAM_SHA}" > last-upstream-sha
        git add -- last-upstream-sha
        if git diff --cached --quiet -- last-upstream-sha; then
          echo "last-upstream-sha 无变化，跳过提交"
        else
          git commit -m "build: record upstream ${REPO_BRANCH} ${UPSTREAM_SHA}"
          git push origin "${{ github.ref_name }}" || echo "push 失败(可忽略)"
        fi
